[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgcr"
version = "1.0.0"
description = "Claim-Grounded Counterfactual Ranking research toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas", "pyarrow", "numpy==2.3.5", "scipy", "pyyaml", "pydantic>=2",
    "rich", "rank-bm25", "transformers==4.57.6", "torch==2.11.0", "datasets",
    "matplotlib", "pytest",
]

authors = [{name = "Muhammad Muneer Umar", email = "muneer.umar@kust.edu.pk"}, {name = "Salma Perveen", email = "salmaperveen89@gmail.com"}]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest", "pip"]
# Ollama HTTP is the debug backend; MLX is primary on Apple Silicon.
local = ["httpx>=0.27"]
baselines = ["peft==0.18.1", "accelerate==1.12.0"]
# Frozen Mac inference versions.
mac = [
    "psutil>=5.9",
    "lm-format-enforcer==0.11.3",
    "mlx-lm==0.29.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.29.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cgcr*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
